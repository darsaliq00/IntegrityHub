name: sync-build-deploy

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      run_sync:
        description: "Run Sync"
        type: choice
        required: true
        default: "Yes"
        options:
          - "Yes"
          - "No"

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  IS_SYNC: ${{ inputs.run_sync == 'Yes' || github.event_name == 'schedule' }}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MMRL-Util
        run: |
          python -m pip install --upgrade pip
          pip install mmrl-util

      - name: Show repository structure
        run: |
          echo "=== Repository ==="
          find . -maxdepth 4 -type f | sort

      - name: Sync modules
        if: ${{ env.IS_SYNC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util sync --diff versions_diff.md

      - name: Show generated module files
        if: ${{ env.IS_SYNC == 'true' }}
        run: |
          echo "=== Modules directory ==="
          find modules -maxdepth 3 -type f | sort

          echo ""
          echo "=== PlayIntegrityFix update.json ==="

          if [ -f modules/playintegrityfix/update.json ]; then
            cat modules/playintegrityfix/update.json
          else
            echo "ERROR: PlayIntegrityFix update.json was not generated"
            exit 1
          fi

      - name: Show versions diff
        if: ${{ env.IS_SYNC == 'true' }}
        run: |
          if [ -f versions_diff.md ]; then
            echo "=== Versions Diff ==="
            cat versions_diff.md
          fi

      - name: Generate index
        if: ${{ env.IS_SYNC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util index --push

      - name: Show latest versions
        if: ${{ env.IS_SYNC != 'true' }}
        run: |
          mmrl-util index --list

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmrl-util-logs
          path: log/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
