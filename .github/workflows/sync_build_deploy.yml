name: sync-build-deploy

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      run_sync:
        description: "Run Sync"
        type: choice
        required: true
        default: "Yes"
        options:
          - "Yes"
          - "No"

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  IS_SYNC: ${{ inputs.run_sync == 'Yes' || github.event_name == 'schedule' }}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mmrl-util

      - name: Update PlayIntegrityFix metadata
        if: ${{ env.IS_SYNC == 'true' }}
        run: |
          python <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          source_url = "https://raw.githubusercontent.com/KOWX712/PlayIntegrityFix/main/update.json"
          output_file = Path("modules/playintegrityfix/update.json")

          print("Downloading upstream PlayIntegrityFix update.json...")
          with urllib.request.urlopen(source_url, timeout=30) as response:
              upstream = json.load(response)

          version = upstream["version"]
          version_code = int(upstream["versionCode"])
          zip_url = upstream["zipUrl"]
          changelog = upstream.get(
              "changelog",
              "https://raw.githubusercontent.com/KOWX712/PlayIntegrityFix/main/changelog.md"
          )

          print(f"Upstream version: {version}")
          print(f"Upstream versionCode: {version_code}")

          existing = {
              "id": "playintegrityfix",
              "timestamp": 0,
              "versions": []
          }

          if output_file.exists():
              try:
                  with output_file.open("r", encoding="utf-8") as f:
                      existing = json.load(f)
              except Exception:
                  pass

          versions = existing.get("versions", [])

          # Remove an existing copy of the same version.
          versions = [
              item for item in versions
              if int(item.get("versionCode", -1)) != version_code
          ]

          # Add newest version first.
          versions.insert(
              0,
              {
                  "timestamp": int(time.time()),
                  "version": version,
                  "versionCode": version_code,
                  "zipUrl": zip_url,
                  "changelog": changelog
              }
          )

          # Keep a reasonable history.
          versions = versions[:100]

          result = {
              "id": "playintegrityfix",
              "timestamp": int(time.time()),
              "versions": versions
          }

          output_file.parent.mkdir(parents=True, exist_ok=True)

          with output_file.open("w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
              f.write("\n")

          print("Generated:")
          print(output_file)
          PY

      - name: Show PlayIntegrityFix update data
        if: ${{ env.IS_SYNC == 'true' }}
        run: |
          cat modules/playintegrityfix/update.json

      - name: Sync
        if: ${{ env.IS_SYNC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util sync --diff versions_diff.md

      - name: Write versions diff to summary
        if: ${{ env.IS_SYNC == 'true' }}
        run: |
          if [ -f versions_diff.md ]; then
            echo "## Versions Diff" >> "$GITHUB_STEP_SUMMARY"
            cat versions_diff.md >> "$GITHUB_STEP_SUMMARY"
            rm versions_diff.md
          fi

      - name: Write latest versions to summary
        if: ${{ env.IS_SYNC != 'true' }}
        run: |
          mmrl-util index --list > latest_versions.md
          echo "## Latest Versions" >> "$GITHUB_STEP_SUMMARY"
          cat latest_versions.md >> "$GITHUB_STEP_SUMMARY"
          rm latest_versions.md

      - name: Index and Push
        if: ${{ env.IS_SYNC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util index --push

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: log/*.log

  build:
    runs-on: ubuntu-latest
    needs: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
