name: sync-build-deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MMRL-Util
        run: |
          python -m pip install --upgrade pip
          pip install mmrl-util

      - name: Sync modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util sync --diff versions_diff.md

      - name: Show generated module files
        run: |
          echo "=== modules directory ==="
          find modules -maxdepth 3 -type f | sort

          echo ""
          echo "=== PlayIntegrityFix update.json ==="
          if [ -f modules/playintegrityfix/update.json ]; then
            cat modules/playintegrityfix/update.json
          else
            echo "ERROR: PlayIntegrityFix update.json was not generated"
            exit 1
          fi

      - name: Generate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util index --push

      - name: Show versions
        run: |
          if [ -f versions_diff.md ]; then
            echo "## Versions" >> "$GITHUB_STEP_SUMMARY"
            cat versions_diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmrl-util-logs
          path: log/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
